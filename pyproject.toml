[project]
name = "waveview"
version = "0.1.0"
description = "Describe digital timing diagrams in Python, render SVG / PNG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "resvg-py>=0.5.0",
]

[project.scripts]
waveview = "waveview.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
